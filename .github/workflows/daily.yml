name: daily-close

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 平日 16:30 JST: 日本株
    - cron: "30 22 * * 1-5"  # 火〜土 7:30 JST: 米国株など海外
  workflow_dispatch:
    inputs:
      market:
        description: "対象市場"
        type: choice
        options: [ALL, JP, US]
        default: ALL

concurrency:
  group: daily-close
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Decide market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then
            echo "value=JP" >> "$GITHUB_OUTPUT"
          else
            echo "value=US" >> "$GITHUB_OUTPUT"
          fi
      - name: Update spreadsheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python -m src.main --market ${{ steps.market.outputs.value }}
