name: daily-close

on:
  # GitHub の定期実行は遅延・取りこぼしがあるため、各市場とも予備の時刻を持たせる（再実行しても重複しない）
  schedule:
    - cron: "30 7 * * 1-5"   # 平日 16:30 JST: 日本株
    - cron: "10 9 * * 1-5"   # 平日 18:10 JST: 日本株（予備）
    - cron: "30 22 * * 1-5"  # 火〜土 7:30 JST: 米国株など海外
    - cron: "10 0 * * 2-6"   # 火〜土 9:10 JST: 米国株など海外（予備）
  workflow_dispatch:
    inputs:
      market:
        description: "対象市場"
        type: choice
        options: [ALL, JP, US]
        default: ALL
      force_report:
        description: "新しい取引日がなくてもレポートを作って通知する"
        type: boolean
        default: false

concurrency:
  group: daily-close
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # レポートを Issue にして通知するため

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Decide market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ] || [ "${{ github.event.schedule }}" = "10 9 * * 1-5" ]; then
            echo "value=JP" >> "$GITHUB_OUTPUT"
          else
            echo "value=US" >> "$GITHUB_OUTPUT"
          fi
      - name: Update spreadsheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python -m src.main --market ${{ steps.market.outputs.value }} --report-out report.md \
            ${{ inputs.force_report && '--force-report' || '' }}
      # レポートを Issue にする（メンションしたリポジトリ所有者に GitHub からメール・アプリ通知が届く）
      - name: Notify report
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '\n\ncc @%s\n' "$OWNER" >> report.md
          gh label create daily-report --color 1a73e8 --description "毎日の株価レポート" --force
          # 前回までのレポート Issue を閉じてから新しいものを作る（作成直後は一覧に出ないことがあるため先に閉じる）
          gh issue list --label daily-report --state open --json number --jq '.[].number' \
            | xargs -r -n1 gh issue close
          gh issue create --title "$(head -1 report.md | sed 's/^# //')" --body-file report.md --label daily-report
