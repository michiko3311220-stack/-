# 判定ロジックの閾値（仮の値。運用しながら調整する）
bottom:
  zone_pct: 5        # 52週安値からの乖離がこの%以内 →「底値圏」
  approach_pct: 10   # この%以内かつ5日騰落マイナス →「接近中」
  lookback_days: 252 # 52週 ≒ 252営業日
trend:
  short_ma: 5
  long_ma: 25
fetch:
  backfill_period: 1y   # 初回・新規銘柄のバックフィル期間
  recent_days: 10       # 通常実行時に取り直す営業日数
view:
  sparkline_days: 65    # ダッシュボードの小さな折れ線（約3ヶ月）
  chart_days: 125       # 区分別グラフの期間（約6ヶ月）。開始日を100として表示
group_labels:
  topix_new_2026_10: TOPIX新規採用
  power: 電力
  ai: AI関連
  defense: 防衛
  security: セキュリティ
  etf: ETF・指数
report:
  # 更新ごとに「買いの注目点」を探すレポートの閾値（仮の値）
  rsi_days: 14
  rsi_oversold: 30        # RSI がこれ以下 → 売られすぎ
  ma_gap_pct: -15         # 25日移動平均からの乖離がこれ以下 → 下げすぎ
  volume_ratio: 2.0       # 出来高が20日平均のこの倍以上 かつ
  volume_up_pct: 2.0      #   前日比がこの%以上 → 買いが集まっている
  segment_weak_pct: -5    # 区分平均の5日騰落がこれ以下の中で
  segment_strong_pct: 2   #   5日騰落がこれ以上 → 区分内で逆行高
  max_items: 15           # 注目銘柄として載せる最大数
